---
- name: Setup dan Konfigurasi LXC Container Debian
  hosts: servers
  become: false # Sudah login sebagai root, sudo belum terpasang di container fresh
  gather_facts: false

  pre_tasks:
    - name: Tunggu hingga service SSH container siap menerima koneksi
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Ambil data fakta sistem
      ansible.builtin.setup:

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Pasang aplikasi utilitas dasar
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - sudo
          - htop
        state: present

    - name: Tampilkan status sukses
      ansible.builtin.debug:
        msg: "LXC Container {{ inventory_hostname }} dengan IP {{ ansible_host }} berhasil dikonfigurasi!"
