---
- name: Setup dan Konfigurasi Server Debian
  hosts: servers
  become: true
  gather_facts: false # Ditunda sampai koneksi SSH siap

  pre_tasks:
    - name: Tunggu hingga service SSH VM siap menerima koneksi
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180

    - name: Ambil data fakta sistem
      ansible.builtin.setup:

  tasks:
    - name: Install SSH Server dan paket utilitas dasar
      ansible.builtin.apt:
        name:
          - openssh-server
          - ca-certificates
          - curl
          - gnupg
          - git
          - htop
        state: present
        update_cache: yes

    - name: Pastikan user memiliki akses sudo tanpa password
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ ansible_user }}"
        line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

    # --- SETUP DOCKER RESMI ---
    - name: Buat direktori keyrings untuk apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Unduh GPG key resmi Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Tambahkan repository resmi Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE, CLI, dan Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Pastikan service Docker aktif dan berjalan otomatis saat boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Masukkan user ke group docker (bisa jalankan docker tanpa sudo)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # --- VERIFIKASI INSTALASI DOCKER ---
    - name: Cek versi Docker yang terpasang
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Cek versi Docker Compose yang terpasang
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Tampilkan status sukses
      ansible.builtin.debug:
        msg:
          - "Server {{ inventory_hostname }} (IP: {{ ansible_host }}) berhasil dikonfigurasi!"
          - "{{ docker_version.stdout }}"
          - "{{ compose_version.stdout }}"
