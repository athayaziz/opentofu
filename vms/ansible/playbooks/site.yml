---
- name: Setup dan Konfigurasi Production Server Debian
  hosts: servers
  become: true
  gather_facts: false # Ditunda sampai koneksi SSH siap

  pre_tasks:
    - name: Tunggu hingga service SSH VM siap menerima koneksi
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Ambil data fakta sistem
      ansible.builtin.setup:

  tasks:
    # -------------------------------------------------------------
    # 1. DEPENDENSI DASAR & PAKET PRODUKSI
    # -------------------------------------------------------------
    - name: Update apt cache dan pasang paket esensial produksi
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - wget
          - git
          - sudo
          - openssh-server
          - qemu-guest-agent
          - htop
          - ufw
          - tar
          - unzip
          - net-tools
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Pastikan service OpenSSH berjalan dan aktif saat boot
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: yes

    - name: Pastikan QEMU Guest Agent berjalan
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: yes

    - name: Pastikan user memiliki akses sudo tanpa password
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ ansible_user }}"
        line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

    # -------------------------------------------------------------
    # 2. INSTALASI DOCKER COMMUNITY EDITION (OFFICIAL REPO)
    # -------------------------------------------------------------
    - name: Cek apakah Docker sudah terpasang
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Setup dan Install Docker CE Resmi
      when: docker_check.rc != 0
      block:
        - name: Unduh GPG key resmi Docker
          ansible.builtin.shell: |
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
          args:
            creates: /etc/apt/keyrings/docker.asc

        - name: Tambahkan repository resmi Docker ke Apt sources
          ansible.builtin.shell: |
            ARCH=$(dpkg --print-architecture)
            CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
            if [ "$CODENAME" = "trixie" ]; then CODENAME="bookworm"; fi
            echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ${CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          args:
            creates: /etc/apt/sources.list.d/docker.list

        - name: Update apt cache dan pasang paket Docker CE & Compose
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: yes

    - name: Pastikan service Docker aktif dan berjalan otomatis saat boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Pastikan user terdaftar di group docker (akses tanpa sudo)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # -------------------------------------------------------------
    # 3. VERIFIKASI & STATUS
    # -------------------------------------------------------------
    - name: Ambil versi Docker yang terpasang
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Tampilkan status sukses
      ansible.builtin.debug:
        msg: "Server {{ inventory_hostname }} ({{ ansible_host }}) siap digunakan! Docker terpasang: {{ docker_version.stdout }}"
